<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Resume Builder</title>
    <link rel="shortcut icon" href="Smart-Resume-Sparkle-Icon.png" type="image/x-icon">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main>
        <header>
            <a href="index.html">
                <div class="logo">
                    <h2>S</h2><h1>Smart<span class="head-grey">Resume</span></h1>
                </div>
            </a>
            <!-- <nav>
                <a href="#features" class="nav-btn">Features</a><a href="#about" class="nav-btn">About</a><a href="templates.html" class="nav-btn">Templates</a>
            </nav> -->
            <a href="editor.html"><button class="get-started" id="choose" data-template="custom">Build Resume <i class="bi bi-arrow-up-right"></i></button></a>
        </header>
        <section class="templates-container">
            <section class="template-cards">
                <section class="template-image"><img src="modern-preview.png"></section>
                <button class="choose" data-template="modern">Choose <i class="bi bi-arrow-up-right"></i></button>
            </section>
            <section class="template-cards">
                <section class="template-image"><img src="minimal-preview.png"></section>
                <button class="choose" data-template="minimal">Choose <i class="bi bi-arrow-up-right"></i></button>
            </section>
            <section class="template-cards">
                <section class="template-image"><img src="developer-preview.png"></section>
                <button class="choose" data-template="developer">Choose <i class="bi bi-arrow-up-right"></i></button>
            </section>
        </section>
        <footer>
            <a href="index.html">
                <div class="logo">
                    <h2>S</h2><h1>Smart<span class="head-grey">Resume</span></h1>
                </div>
            </a>
            <p>Designed for your next opportunity.</p>
            <span class="foot-span">© 2026 Smart Resume Builder</span>
        </footer>
    </main>
    <script src="template.js"></script>
</body>
</html>
